name: fXChat
version: √8
main: com.fluxcraft.fXChat.FXChat
api-version: 1.21
author: FluxCraft
description: 高级聊天格式插件，支持PAPI变量和Folia/Paper核心
folia-supported: true

commands:
  fluxchat:
    description: fXChat 管理命令
    usage: /<command> [reload|info]
    permission: fxchat.reload
    aliases: [fchat, fxc]

permissions:
  fxchat.reload:
    description: 允许重载fXChat配置
    default: op
  fxchat.info:
    description: 允许查看插件信息
    default: true
